name: YouTube RSS to Feishu
on:
  # 定时执行：每10分钟运行一次（cron表达式，UTC时间，需注意时区）
  schedule:
    - cron: '0 1 * * *'
  # 手动触发（方便测试）
  workflow_dispatch:

jobs:
  send-feishu-message:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 核心：允许写入仓库内容
    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 指定Python版本

      # 步骤3：安装依赖（解析RSS和发送请求）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      # 步骤4：运行Python脚本（读取环境变量）
      - name: Run RSS script
        env:
          YOUTUBE_RSS_URL: ${{ secrets.YOUTUBE_RSS_URL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python youtube_rss_feishu.py

      # 步骤5：提交已推送的视频ID文件到仓库（避免重复发送）
      - name: Commit sent videos file
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add sent_videos.txt
          git commit -m "Update sent videos list" || echo "No new videos to commit"
          git push
